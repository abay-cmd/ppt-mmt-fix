const SC=["Sapaan: Assalamualaikum. Perhatikan gedung ini. Ia adalah lembaga pendidikan Islam. Pesawat itu adalah tuntutan zaman yang terus mengelilinginya. Memutar gedung berarti melihat lembaga dari segala sisi, dan itulah fungsi model manajemen mutu. Mari mulai dari sebuah cerita.",
"Story: Saya pernah mengunjungi sebuah madrasah yang berkasnya rapi dan penuh sertifikat. Tetapi ketika pimpinannya berganti, program berhenti dan guru bingung harus mengikuti siapa. Catatan: ganti dengan pengalaman pribadimu bila ada.\nObservation: Kita sering melihat spanduk akreditasi terpasang, guru kewalahan mengisi dokumen, dan murid dikejar angka ujian.\nConnection: Ini bukan masalah satu lembaga. Mutu harus terukur tetapi tetap bernilai, dan tata kelola harus melibatkan banyak pihak. Seberapa nyata masalah ini?",
"Insight: Ada empat angka dari makalah ini. Empat model mutu, tujuh kategori Baldrige, delapan standar nasional pendidikan, dan dua nilai inti, yaitu ihsan dan itqan. Di balik angka itu ada masalah nyata: sistem patrimonial memusatkan kewenangan pada satu figur, sehingga tata kelola rapuh saat pimpinan berganti. Karena itu mutu bukan lagi pilihan. Lalu ke mana pembahasan ini membawa kita?",
"Agenda: Kita berjalan melewati enam perhentian. Dimulai dari nilai, lalu konsep dasar, empat model mutu, cara memadukannya, tantangan beserta solusinya, dan ditutup dengan simpulan. Sebelum berangkat, mari lihat mengapa ini penting bagi kita.",
"Lo-fane atau Impact: Mengapa kita harus peduli? Karena layanan menjadi tertib tanpa kehilangan ruh pendidikan, keputusan tidak bergantung pada satu figur, murid dilayani secara utuh, dan standar universal kita adaptasi secara kritis. Lalu, bagaimana kajian ini dilakukan?",
"Kajian ini adalah telaah konseptual melalui studi kepustakaan dengan analisis deskriptif dan komparatif. Kami tidak meneliti di lapangan, jadi tidak mengukur efektivitas penerapan, melainkan membandingkan kerangka pemikiran. Kita mulai dari akar nilainya.",
"Mutu dalam Islam tidak berhenti pada capaian administratif. Ihsan adalah menghadirkan kebaikan dalam setiap tindakan, itqan adalah ketekunan dan kecermatan. Surat Al-Mulk ayat 2 menegaskan bahwa amal terbaik adalah yang tepat dan ikhlas, bukan sekadar terbanyak. Ada ayat lain yang memperluas fondasi ini.",
"Tiga ayat menopang budaya mutu: At-Tawbah ayat 105 tentang akuntabilitas, An-Nahl ayat 90 tentang keadilan dan kebajikan, dan Ar-Ra'd ayat 11 tentang pembaruan. Karena angka saja tidak cukup mewakili niat dan akhlak, penilaian mutu perlu memadukan data dan pertimbangan kualitatif. Dari nilai, kita masuk ke konsep.",
"Manajemen Mutu Terpadu bukan sekadar prosedur pemeriksaan dan bukan menyalin cara kerja pabrik. Ia bertumpu pada pemangku kepentingan, komitmen pimpinan, partisipasi, dan data. Mutu adalah hasil proses yang dikelola bersama. Prinsip ini butuh kerangka kerja, yaitu TQM.",
"TQM mengelola seluruh proses yang memengaruhi mutu, berakar pada pemikiran Deming. Dua kuncinya: arah jangka panjang yang teguh, dan iklim aman agar guru berani menyampaikan kendala. Aman bukan berarti tanpa standar. Arah itu dijabarkan melalui Trilogi Juran dan Kaizen.",
"Trilogi Juran menjabarkan arah menjadi perencanaan, pengendalian, dan peningkatan mutu. Kaizen menambahkan perbaikan kecil yang konsisten, misalnya umpan balik yang terlambat. Semangatnya selaras dengan ikhtiar dan islah, meski tidak identik. Namun pendidikan bukan pabrik, di sinilah TQE berperan.",
"Sallis mengadaptasi TQM ke pendidikan. Hard quality adalah yang terukur, soft quality adalah relasi dan budaya. Angka tinggi belum tentu pemahaman mendalam, dan dokumen lengkap belum jaminan mutu pengalaman belajar. Budaya dan nilai butuh sistem agar tetap berjalan, di sinilah ISO masuk.",
"ISO 9001:2015 menetapkan persyaratan sistem manajemen mutu, fokus pada proses dan konsistensi, bukan menyeragamkan pedagogi. Siklus Plan, Do, Check, Act menjaga proses berjalan dan diperbaiki, sehingga sistem tetap hidup saat pimpinan berganti. Tetapi sistem yang baik harus ringan.",
"Berpikir berbasis risiko berarti mengenali hambatan lebih awal. Dokumen yang baik relevan dan mudah dipakai, bukan banyak. Sertifikat adalah pengakuan sistem, bukan jaminan semua aspek bermutu. Waspadai birokratisasi agar guru tetap mendampingi murid. Konsistensi belum menjelaskan keunggulan kinerja menyeluruh, itu wilayah Baldrige.",
"Baldrige menilai kinerja secara menyeluruh dalam tujuh kategori: kepemimpinan, perencanaan strategis, murid dan pemangku kepentingan, pengukuran dan pengetahuan, tenaga kerja, operasi, dan hasil. Hasil adalah konsekuensi dari cara organisasi dijalankan. Bagaimana cara membacanya?",
"ADLI menilai proses: dirancang baik, diterapkan, dipelajari, dan selaras. LeTCI menilai hasil: posisi capaian, arah, perbandingan, dan keselarasan. Baldrige bukan perlombaan skor. Empat model sudah kita lihat, sekarang kita pertemukan.",
"Keempat model punya titik tekan berbeda. TQM pada budaya dan partisipasi, TQE pada pembentukan manusia, ISO pada proses dan dokumentasi, Baldrige pada kinerja sistemik. Bila dilihat bersama, keempatnya saling melengkapi.",
"Keempatnya bukan tahapan kaku. Urutannya menyesuaikan kesiapan lembaga, dan integrasi tidak berarti melebur menjadi satu perangkat. Hasilnya memenuhi delapan standar nasional dan menaikkan daya saing, dengan ihsan dan itqan sebagai nilai yang menembus semuanya. Tentu jalannya tidak mulus.",
